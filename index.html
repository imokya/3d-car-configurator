<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0d0f12" />
    <title>3D Car Configurator 行歌</title>
    <meta
      name="description"
      content="Explore the McLaren Artura. Personalize its finish, discover every detail, and sculpt it with light."
    />
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%2317191b'/%3E%3Cpath d='M12 46 31 16h10L30 34h17l-8 12H12Z' fill='%23ff7900'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="app" id="app">
      <main>
        <section class="stage" aria-label="McLaren Artura 3D experience">
          <div
            id="scene"
            tabindex="0"
            role="img"
            aria-label="Interactive McLaren Artura. Drag to rotate, scroll to zoom. Arrow keys to orbit, plus and minus to zoom."
          ></div>

          <a
            class="wordmark"
            href="https://www.xingor.dev"
            target="_blank"
            rel="noopener"
            aria-label="Xingor — 行歌的个人网站"
            title="www.xingor.dev"
          >
            <span class="wordmark-text">Xingor</span>
            <span class="speedmark" aria-hidden="true"></span>
          </a>

          <div
            class="studio-selector"
            role="group"
            aria-label="Studio lighting"
          >
            <button
              id="day"
              class="active"
              aria-pressed="true"
              title="Daylight studio"
            >
              <svg viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"
                />
              </svg>
            </button>
            <button id="night" aria-pressed="false" title="Night studio">
              <svg viewBox="0 0 24 24">
                <path d="M20.5 14A9 9 0 0 1 10 3.5 9 9 0 1 0 20.5 14Z" />
              </svg>
            </button>
            <button id="aero" aria-pressed="false" title="Aerodynamics mode">
              <svg viewBox="0 0 24 24">
                <path
                  d="M3 8h9.5a2.5 2.5 0 1 0-2.5-2.5M3 12h14a2.5 2.5 0 1 1-2.5 2.5M3 16h7"
                />
              </svg>
            </button>
          </div>

          <div class="config" role="group" aria-label="Vehicle configuration">
            <div class="swatches" aria-label="Choose a paint finish">
              <button
                class="swatch selected"
                data-color="papaya"
                style="--paint: #f47821"
                aria-label="Papaya Spark Metallic"
                aria-pressed="true"
              ></button>
              <button
                class="swatch"
                data-color="lime"
                style="--paint: #aac626"
                aria-label="Lime Green Metallic"
                aria-pressed="false"
              ></button>
              <button
                class="swatch"
                data-color="blue"
                style="--paint: #266690"
                aria-label="Aurora Blue Metallic"
                aria-pressed="false"
              ></button>
              <button
                class="swatch"
                data-color="white"
                style="--paint: #eeeeeb"
                aria-label="Silica White Pearlescent"
                aria-pressed="false"
              ></button>
              <button
                class="swatch"
                data-color="silver"
                style="--paint: #828b94"
                aria-label="Titanium Silver Metallic"
                aria-pressed="false"
              ></button>
              <button
                class="swatch"
                data-color="black"
                style="--paint: #232529"
                aria-label="Onyx Black Metallic"
                aria-pressed="false"
              ></button>
            </div>
            <span class="config-divider" aria-hidden="true"></span>
            <button
              id="lights"
              class="toggle"
              role="switch"
              aria-checked="false"
              aria-label="Turn headlights on"
              title="Headlights"
            >
              <svg viewBox="0 0 24 24">
                <path
                  d="M9 3h6M10 5.5h4M12 6.5c-3 0-5 2.2-5 5 0 1.9 1 3.2 2 4.2.7.7 1 1.4 1 2.3v.5h4v-.5c0-.9.3-1.6 1-2.3 1-1 2-2.3 2-4.2 0-2.8-2-5-5-5ZM10 21h4"
                />
              </svg>
            </button>
          </div>

          <nav class="views" aria-label="Explore the details">
            <button
              class="view active"
              data-view="overview"
              aria-pressed="true"
            >Overview</button>
            <button class="view" data-view="front" aria-pressed="false">Front</button>
            <button class="view" data-view="wheels" aria-pressed="false">Wheels</button>
            <button class="view" data-view="side" aria-pressed="false">Aero</button>
            <button class="view" data-view="cockpit" aria-pressed="false">Cockpit</button>
            <button class="view" data-view="rear" aria-pressed="false">Rear</button>
          </nav>

          <button
            id="reset"
            class="reset"
            aria-label="Reset camera to Overview"
            title="Reset view"
          >
            <svg viewBox="0 0 24 24">
              <path d="M4 10a8 8 0 1 1 1 7M4 4v6h6" />
            </svg>
          </button>

          <div class="brand">
            CREATED BY
            <a href="https://www.xingor.dev" target="_blank" rel="noopener">行歌</a>
            @2026
          </div>

          <div class="loader" id="loader">
            <div class="loader-word">CAR CONFIGURATOR</div>
            <div class="load-track"><i id="load-progress"></i></div>
            <button id="retry" hidden>Try again</button>
          </div>
        </section>
      </main>
      <aside id="debug" class="debug" hidden aria-label="Debug controls">
        <div class="debug-head">
          <strong>DEBUG</strong><span>#debug</span
          ><button
            id="debug-close"
            type="button"
            aria-label="Close debug panel"
          >
            ✕
          </button>
        </div>
        <div class="debug-body">
          <div class="debug-group">
            <h5>Environment</h5>
            <label for="dbg-env"
              >Environment intensity
              <output id="dbg-env-out">1.00×</output></label
            ><input
              id="dbg-env"
              type="range"
              min="0"
              max="3"
              step=".05"
              value="1"
            />
            <label for="dbg-ambient"
              >Ambient light <output id="dbg-ambient-out">1.00×</output></label
            ><input
              id="dbg-ambient"
              type="range"
              min="0"
              max="4"
              step=".05"
              value="1"
            />
            <label for="dbg-exposure"
              >Exposure <output id="dbg-exposure-out">1.30</output></label
            ><input
              id="dbg-exposure"
              type="range"
              min=".2"
              max="2.5"
              step=".01"
              value="1.3"
            />
          </div>
          <div class="debug-group">
            <h5>Paint clearcoat</h5>
            <label for="dbg-coat"
              >Clearcoat <output id="dbg-coat-out">1.00</output></label
            ><input
              id="dbg-coat"
              type="range"
              min="0"
              max="10"
              step=".01"
              value="1"
            />
            <label for="dbg-coat-r"
              >Clearcoat roughness
              <output id="dbg-coat-r-out">0.000</output></label
            ><input
              id="dbg-coat-r"
              type="range"
              min="0"
              max=".4"
              step=".005"
              value="0"
            />
            <label for="dbg-envmap"
              >Paint envMap intensity
              <output id="dbg-envmap-out">1.90</output></label
            ><input
              id="dbg-envmap"
              type="range"
              min="0"
              max="3"
              step=".05"
              value="1.9"
            />
          </div>
          <div class="debug-group">
            <h5>Bloom</h5>
            <label for="dbg-bloom"
              >Strength <output id="dbg-bloom-out">0.10</output></label
            ><input
              id="dbg-bloom"
              type="range"
              min="0"
              max="4"
              step=".01"
              value="0.1"
            />
            <label for="dbg-bloom-r"
              >Radius <output id="dbg-bloom-r-out">0.15</output></label
            ><input
              id="dbg-bloom-r"
              type="range"
              min="0"
              max="1"
              step=".01"
              value=".15"
            />
            <label for="dbg-bloom-t"
              >Threshold <output id="dbg-bloom-t-out">0.50</output></label
            ><input
              id="dbg-bloom-t"
              type="range"
              min="0"
              max="6"
              step=".01"
              value=".5"
            />
          </div>
        </div>
        <div class="debug-foot">
          <button id="debug-copy" type="button">Copy values</button
          ><button id="debug-reset" type="button">Reset</button
          ><output id="debug-status"></output>
        </div>
      </aside>
      <div class="sr-only" id="announcement" aria-live="polite"></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
